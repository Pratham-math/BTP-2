services:
  api:
    build:
      context: ..
      dockerfile: deploy/Api.Dockerfile
    env_file: ../.env
    environment:
      DATABASE_SSL_ROOT_CERT: /run/certs/supabase-ca.crt
      SUPABASE_AUTH_ADMIN_KEY: ""
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../.local/supabase-ca.crt:/run/certs/supabase-ca.crt:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  worker:
    profiles: [worker]
    build:
      context: ..
      dockerfile: deploy/Worker.Dockerfile
    env_file: ../.env
    environment:
      DATABASE_SSL_ROOT_CERT: /run/certs/supabase-ca.crt
      SUPABASE_AUTH_ADMIN_KEY: ""
      DOCUMENT_SANDBOX_VERIFIED: "false"
    volumes:
      - worker-cache:/app/.run
      - ../.local/supabase-ca.crt:/run/certs/supabase-ca.crt:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  grader:
    profiles: [worker]
    build:
      context: ..
      dockerfile: deploy/Worker.Dockerfile
    command: ["--queue", "grading"]
    env_file: ../.env
    environment:
      DATABASE_SSL_ROOT_CERT: /run/certs/supabase-ca.crt
      SUPABASE_AUTH_ADMIN_KEY: ""
      DOCUMENT_SANDBOX_VERIFIED: "false"
    volumes:
      - worker-cache:/app/.run
      - ../.local/supabase-ca.crt:/run/certs/supabase-ca.crt:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  maintenance:
    profiles: [worker]
    build:
      context: ..
      dockerfile: deploy/Worker.Dockerfile
    command: ["--queue", "maintenance"]
    env_file: ../.env
    environment:
      DATABASE_SSL_ROOT_CERT: /run/certs/supabase-ca.crt
    volumes:
      - worker-cache:/app/.run
      - ../.local/supabase-ca.crt:/run/certs/supabase-ca.crt:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
volumes:
  worker-cache:
